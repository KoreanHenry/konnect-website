<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Konnect</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%239B7AF0'/%3E%3Cstop offset='60%25' stop-color='%236B35E8'/%3E%3Cstop offset='100%25' stop-color='%232E0B73'/%3E%3C/radialGradient%3E%3C/defs%3E%3Cellipse cx='16' cy='16' rx='15' ry='4.5' fill='none' stroke='%236B35E8' stroke-width='2.5' transform='rotate(-20 16 16)'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0A0118;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased;}
.orb{position:fixed;border-radius:50%;filter:blur(120px);pointer-events:none;}
.orb1{width:600px;height:600px;background:#6B35E8;top:-200px;right:-200px;opacity:.25;}
.orb2{width:400px;height:400px;background:#FF3DA8;bottom:-100px;left:-100px;opacity:.15;}

.wrap{position:relative;z-index:10;text-align:center;padding:40px 24px;}

.planet-wrap{width:200px;height:200px;margin:0 auto 40px;animation:float 7s ease-in-out infinite;position:relative;}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-16px) rotate(4deg);}}
.planet{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#9B7AF0,#6B35E8 45%,#2E0B73);box-shadow:0 0 70px rgba(107,53,232,.55);}
.ring{position:absolute;top:50%;left:50%;width:220px;height:54px;border:10px solid #6B35E8;border-radius:50%;transform:translate(-50%,-50%) rotateX(76deg) rotate(-18deg);box-shadow:0 0 30px rgba(107,53,232,.5);}
.num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Bricolage Grotesque',sans-serif;font-size:42px;font-weight:800;color:#fff;text-shadow:0 0 30px rgba(155,122,240,.8);letter-spacing:-.04em;}

.star{position:absolute;fill:white;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.2;}50%{opacity:.9;}}
.s1{top:5%;left:10%;width:14px;animation-delay:0s;}
.s2{top:15%;right:8%;width:10px;animation-delay:.6s;}
.s3{bottom:20%;left:8%;width:18px;animation-delay:1.2s;}
.s4{bottom:30%;right:12%;width:12px;animation-delay:1.8s;}

h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-.04em;margin-bottom:16px;line-height:1;}
.accent{background:linear-gradient(130deg,#9B7AF0,#FF3DA8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-style:italic;font-weight:400;}
p{font-size:17px;color:rgba(255,255,255,.55);line-height:1.65;margin-bottom:36px;max-width:360px;margin-left:auto;margin-right:auto;}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn-home{background:#fff;color:#0A0118;padding:14px 26px;border-radius:100px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 0 40px rgba(107,53,232,.4);}
.btn-home:hover{transform:scale(1.04);box-shadow:0 0 60px rgba(107,53,232,.65);color:#0A0118;}
.btn-join{color:rgba(255,255,255,.55);text-decoration:none;font-size:15px;font-weight:500;padding:14px 4px;transition:color .2s;}
.btn-join:hover{color:#fff;}

.lang-toggle{position:absolute;top:24px;right:24px;display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:100px;padding:3px;gap:2px;}
.lang-btn{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.45);transition:all .2s;}
.lang-btn.active{background:#fff;color:#0A0118;}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="lang-toggle">
  <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
  <button class="lang-btn" id="btn-ko" onclick="setLang('ko')">한</button>
</div>

<div class="wrap">
  <svg class="star s1" viewBox="0 0 24 24"><path d="M12 0l1.5 10.5L24 12l-10.5 1.5L12 24l-1.5-10.5L0 12l10.5-1.5z"/></svg>
  <svg class="star s2" viewBox="0 0 24 24"><path d="M12 0l1.5 10.5L24 12l-10.5 1.5L12 24l-1.5-10.5L0 12l10.5-1.5z"/></svg>
  <svg class="star s3" viewBox="0 0 24 24"><path d="M12 0l1.5 10.5L24 12l-10.5 1.5L12 24l-1.5-10.5L0 12l10.5-1.5z"/></svg>
  <svg class="star s4" viewBox="0 0 24 24"><path d="M12 0l1.5 10.5L24 12l-10.5 1.5L12 24l-1.5-10.5L0 12l10.5-1.5z"/></svg>

  <div class="planet-wrap">
    <div class="ring"></div>
    <div class="planet"></div>
    <div class="num">404</div>
  </div>

  <h1>Lost in <span class="accent">space?</span></h1>
  <p id="desc">This page doesn't exist. But Seoul does — and so does the next KONNECT meetup.</p>
  <div class="actions">
    <a href="/" class="btn-home" id="btn-home">Back to Earth →</a>
    <a href="/join.html" class="btn-join" id="btn-join">Join a meetup</a>
  </div>
</div>

<script>
const T = {
  en:{desc:"This page doesn't exist. But Seoul does — and so does the next KONNECT meetup.",home:"Back to Earth →",join:"Join a meetup"},
  ko:{desc:"이 페이지는 존재하지 않아요. 하지만 서울은 있고, 다음 KONNECT 모임도 곧 열려요.",home:"홈으로 돌아가기 →",join:"모임 신청하기"}
};
function setLang(l){
  document.getElementById('desc').textContent=T[l].desc;
  document.getElementById('btn-home').textContent=T[l].home;
  document.getElementById('btn-join').textContent=T[l].join;
  document.getElementById('btn-en').classList.toggle('active',l==='en');
  document.getElementById('btn-ko').classList.toggle('active',l==='ko');
  localStorage.setItem('konnect-lang',l);
}
const saved=localStorage.getItem('konnect-lang');
const bl=(navigator.language||'en').toLowerCase();
setLang(saved||(bl.startsWith('ko')?'ko':'en'));
</script>
</body>
</html>
