<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--purple:#6B35E8;--purple-deep:#2E0B73;--purple-light:#9B7AF0;--pink:#FF3DA8;--black:#0A0118;--white:#fff;--border:rgba(255,255,255,.09);--gray:rgba(255,255,255,.055);}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--black);color:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:20px 48px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,1,24,.72);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:21px;letter-spacing:-.02em;text-decoration:none;color:#fff;}
.nav-actions{display:flex;align-items:center;gap:14px;}
.nav-back{color:rgba(255,255,255,.55);text-decoration:none;font-size:14px;font-weight:600;transition:color .2s;}
.nav-back:hover{color:#fff;}
.lang-toggle{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:100px;padding:3px;gap:2px;}
.lang-btn{padding:5px 12px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.45);transition:all .2s;}
.lang-btn.active{background:#fff;color:#0A0118;}
/* HERO */
.hero{position:relative;min-height:88vh;padding:160px 48px 90px;overflow:hidden;display:flex;align-items:center;}
.orb{position:absolute;border-radius:50%;filter:blur(100px);pointer-events:none;}
.orb1{width:640px;height:640px;background:var(--purple);top:-200px;right:-180px;opacity:.32;}
.orb2{width:440px;height:440px;background:var(--pink);bottom:-140px;left:-140px;opacity:.2;}
.hero-inner{position:relative;z-index:2;max-width:1180px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.28);padding:7px 15px;border-radius:100px;font-size:12px;color:#fbbf24;margin-bottom:24px;font-weight:600;}
.badge-dot{width:7px;height:7px;border-radius:50%;background:#fbbf24;flex-shrink:0;}
h1{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(48px,6.5vw,90px);line-height:.92;letter-spacing:-.045em;font-weight:800;margin-bottom:22px;}
.accent{background:linear-gradient(135deg,var(--purple-light),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{font-size:18px;line-height:1.7;color:rgba(255,255,255,.62);max-width:560px;margin-bottom:34px;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;border-radius:100px;text-decoration:none;font-weight:800;font-size:15px;transition:transform .2s,box-shadow .2s;background:#fff;color:#0A0118;padding:16px 28px;box-shadow:0 0 40px rgba(107,53,232,.4);}
.btn-pink{display:inline-flex;align-items:center;justify-content:center;border-radius:100px;text-decoration:none;font-weight:800;font-size:15px;transition:transform .2s,box-shadow .2s;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;padding:16px 28px;box-shadow:0 0 40px rgba(255,61,168,.28);}
.btn-primary:hover,.btn-pink:hover{transform:scale(1.03);}
.btn-ghost{color:rgba(255,255,255,.6);text-decoration:none;font-weight:700;font-size:15px;padding:12px 6px;}
/* HERO CARD */
.hero-card{background:linear-gradient(135deg,rgba(107,53,232,.18),rgba(255,61,168,.1));border:1px solid rgba(107,53,232,.38);border-radius:28px;padding:32px;box-shadow:0 20px 80px rgba(0,0,0,.28);}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.info-pill{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:16px;padding:16px;}
.info-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:6px;}
.info-value{font-weight:800;font-size:15px;line-height:1.3;}
.price-card{border-radius:18px;padding:20px;background:rgba(255,255,255,.06);border:1px solid rgba(107,53,232,.28);}
.price-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.price-row:last-child{border-bottom:none;}
.price-name{color:rgba(255,255,255,.55);font-size:13px;line-height:1.4;}
.price-val{font-weight:800;color:#fff;font-size:14px;white-space:nowrap;}
.price-val.mid{color:#9B7AF0;}
.price-val.best{color:#FF3DA8;}
/* SECTIONS */
.section{padding:96px 48px;position:relative;}
.section-inner{max-width:1120px;margin:0 auto;}
.section-tag{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--purple-light);font-weight:700;margin-bottom:16px;display:inline-block;}
.section-title{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(32px,4vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-bottom:18px;}
.section-sub{font-size:17px;line-height:1.75;color:rgba(255,255,255,.58);max-width:760px;}
/* TIMELINE */
.timeline{display:grid;gap:14px;margin-top:42px;}
.timeline-item{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:center;background:var(--gray);border:1px solid var(--border);border-radius:20px;padding:22px 26px;}
.timeline-item.part1{border-color:rgba(107,53,232,.38);background:rgba(107,53,232,.09);}
.timeline-item.part2{border-color:rgba(255,61,168,.32);background:rgba(255,61,168,.07);}
.timeline-item.brk{opacity:.6;}
.timeline-time{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:800;color:rgba(255,255,255,.85);}
.timeline-body{}
.timeline-activity{font-size:17px;font-weight:800;margin-bottom:4px;}
.timeline-place{font-size:14px;color:rgba(255,255,255,.45);}
/* TOPICS */
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:42px;}
.topic-card{background:var(--gray);border:1px solid rgba(107,53,232,.3);border-radius:22px;padding:28px;}
.topic-card.w2{border-color:rgba(255,61,168,.3);background:rgba(255,61,168,.05);}
.topic-week{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-light);font-weight:700;margin-bottom:12px;}
.topic-card.w2 .topic-week{color:#FF3DA8;}
.topic-title{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:800;margin-bottom:10px;}
.topic-desc{font-size:15px;line-height:1.65;color:rgba(255,255,255,.55);}
/* TEACHERS */
.teacher-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:42px;}
.teacher-card{background:var(--gray);border:1px solid rgba(107,53,232,.3);border-radius:24px;padding:32px;}
.teacher-card.t2{border-color:rgba(255,61,168,.3);}
.teacher-flag{font-size:42px;margin-bottom:18px;}
.teacher-name{font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:800;margin-bottom:4px;}
.teacher-role{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--purple-light);font-weight:700;margin-bottom:22px;}
.teacher-card.t2 .teacher-role{color:#FF3DA8;}
.teacher-creds{list-style:none;display:grid;gap:9px;}
.teacher-creds li{padding:11px 15px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:14px;color:rgba(255,255,255,.68);line-height:1.5;}
/* WHO */
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:42px;}
.who-card{background:var(--gray);border:1px solid var(--border);border-radius:18px;padding:22px 20px;font-size:15px;color:rgba(255,255,255,.7);line-height:1.65;}
/* PRICE TIERS */
.price-tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:42px;}
.price-tier{background:var(--gray);border:1px solid var(--border);border-radius:22px;padding:28px;text-align:center;}
.price-tier.mid{border-color:rgba(107,53,232,.45);background:rgba(107,53,232,.1);}
.price-tier.best{border-color:rgba(255,61,168,.4);background:rgba(255,61,168,.08);}
.tier-label{font-size:13px;color:rgba(255,255,255,.42);line-height:1.45;margin-bottom:18px;min-height:38px;display:flex;align-items:center;justify-content:center;}
.tier-price{font-family:'Bricolage Grotesque',sans-serif;font-size:36px;font-weight:800;margin-bottom:6px;}
.tier-sub{font-size:13px;color:rgba(255,255,255,.32);}
.price-note{font-size:13px;color:rgba(255,255,255,.42);margin-top:20px;line-height:1.7;}
/* FAQ */
.faq-list{margin-top:42px;display:grid;gap:14px;}
.faq-item{background:var(--gray);border:1px solid var(--border);border-radius:18px;padding:22px;}
.faq-q{font-weight:800;margin-bottom:8px;}
.faq-a{font-size:15px;line-height:1.65;color:rgba(255,255,255,.55);}
/* FINAL */
.final{padding:104px 48px 120px;text-align:center;background:linear-gradient(180deg,transparent,rgba(107,53,232,.08));}
.final .section-sub{margin:0 auto 34px;}
.final-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
footer{border-top:1px solid var(--border);padding:36px 48px;color:rgba(255,255,255,.3);font-size:12px;line-height:1.7;}
/* RESPONSIVE */
@media(max-width:920px){
  .nav{padding:18px 24px;}
  .hero{padding:140px 24px 70px;}
  .hero-inner{grid-template-columns:1fr;gap:36px;}
  .section{padding:72px 24px;}
  .topic-grid,.teacher-grid,.who-grid{grid-template-columns:1fr;}
  .price-tiers{grid-template-columns:1fr;}
  .timeline-item{grid-template-columns:1fr;gap:8px;}
  .final{padding:80px 24px 96px;}
  footer{padding:28px 24px;}
}
@media(max-width:640px){
  .nav-back{display:none;}
  .hero{padding-top:120px;}
  .hero-actions{flex-direction:column;align-items:stretch;}
  .btn-primary,.btn-pink{text-align:center;}
  .hero-card{padding:22px;}
}

function getLang(){return localStorage.getItem('konnect-lang')||((navigator.language||'en').toLowerCase().startsWith('ko')?'ko':'en');}
function el(id){return document.getElementById(id);}
function txt(id,html){const e=el(id);if(e)e.innerHTML=html;}

function setLang(lang){
  localStorage.setItem('konnect-lang',lang);
  document.documentElement.lang=lang;
  el('btn-en').classList.toggle('active',lang==='en');
  el('btn-ko').classList.toggle('active',lang==='ko');
  render();
}

function render(){
  const lang=getLang();
  const t=T[lang];
  txt('nav-back',t.navBack);
  txt('hero-badge',t.badge);
  txt('hero-title',t.heroTitle);
  txt('hero-sub',t.heroSub);
  const cta=el('hero-cta');if(cta){cta.textContent=t.heroCta;cta.href=t.heroCtaHref;}
  txt('hero-secondary',t.heroSecondary);
  txt('lbl-date',t.lblDate);txt('lbl-time',t.lblTime);txt('lbl-spots',t.lblSpots);txt('lbl-price',t.lblPrice);
  txt('info-date',t.infoDate);txt('info-time',t.infoTime);txt('info-spots',t.infoSpots);txt('info-price',t.infoPrice);
  txt('pc-r-label',t.pcRLabel);txt('pc-r-price',t.pcRPrice);
  txt('pc-m-label',t.pcMLabel);txt('pc-m-price',t.pcMPrice);
  txt('pc-b-label',t.pcBLabel);txt('pc-b-price',t.pcBPrice);
  txt('how-tag',t.howTag);txt('how-title',t.howTitle);txt('how-sub',t.howSub);
  el('how-timeline').innerHTML=t.schedule.map(s=>`
    <div class="timeline-item ${s.cls}">
      <div class="timeline-time">${s.time}</div>
      <div class="timeline-body">
        <div class="timeline-activity">${s.activity}</div>
        ${s.place?`<div class="timeline-place">${s.place}</div>`:''}
      </div>
    </div>`).join('');
  txt('topics-tag',t.topicsTag);txt('topics-title',t.topicsTitle);
  el('topics-grid').innerHTML=t.topics.map(tp=>`
    <div class="topic-card ${tp.cls}">
      <div class="topic-week">${tp.week}</div>
      <div class="topic-title">${tp.title}</div>
      <div class="topic-desc">${tp.desc}</div>
    </div>`).join('');
  txt('teachers-tag',t.teachersTag);txt('teachers-title',t.teachersTitle);
  el('teachers-grid').innerHTML=t.teachers.map(tc=>`
    <div class="teacher-card ${tc.cls}">
      <div class="teacher-flag">${tc.flag}</div>
      <div class="teacher-name">${tc.name}</div>
      <div class="teacher-role">${tc.role}</div>
      <ul class="teacher-creds">${tc.creds.map(c=>`<li>✓ ${c}</li>`).join('')}</ul>
    </div>`).join('');
  txt('who-tag',t.whoTag);txt('who-title',t.whoTitle);
  el('who-grid').innerHTML=t.who.map(w=>`<div class="who-card">✓ ${w}</div>`).join('');
  txt('price-tag',t.priceTag);txt('price-title',t.priceTitle);
  el('price-tiers').innerHTML=t.priceTiers.map(p=>`
    <div class="price-tier ${p.cls}">
      <div class="tier-label">${p.label}</div>
      <div class="tier-price">${p.price}</div>
      <div class="tier-sub">${p.sub||'&nbsp;'}</div>
    </div>`).join('');
  txt('price-note',t.priceNote);
  txt('faq-tag',t.faqTag);txt('faq-title',t.faqTitle);
  el('faq-list').innerHTML=t.faqs.map(f=>`
    <div class="faq-item"><div class="faq-q">${f.q}</div><div class="faq-a">${f.a}</div></div>`).join('');
  txt('final-title',t.finalTitle);txt('final-sub',t.finalSub);
  const fc=el('final-cta');if(fc){fc.textContent=t.finalCta;fc.href=t.finalCtaHref;}
  const fa=el('final-cta-alt');if(fa){fa.textContent=t.finalCtaAlt;fa.href=t.finalCtaAltHref;}
}

document.addEventListener('DOMContentLoaded',()=>{
  const urlLang=new URLSearchParams(window.location.search).get('lang');
  if(urlLang==='ko'||urlLang==='en')localStorage.setItem('konnect-lang',urlLang);
  render();
});
</script>
